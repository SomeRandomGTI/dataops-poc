name: DataOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  # -------------------------
  # 1️⃣ DEPLOY DEV + Validation + Schema Check
  # -------------------------
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set ENV variables
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME_DEV }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST_DEV }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER_DEV }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD_DEV }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT_DEV }}" >> $GITHUB_ENV

      - name: Schema Validation (DEV)
        run: |
          echo "Validating DEV schema..."
          EXPECTED_COLUMNS=("id" "name" "email" "created_at")
          for col in "${EXPECTED_COLUMNS[@]}"; do
            EXISTS=$(PGPASSWORD=$DB_PASSWORD psql -t -A -h $DB_HOST -U $DB_USER -d $DB_NAME -c "SELECT column_name FROM information_schema.columns WHERE table_name='customers' AND column_name='$col';")
            if [ -z "$EXISTS" ]; then
              echo "❌ Schema validation failed: missing column $col"
              exit 1
            fi
          done
          echo "✅ DEV schema validation passed"

      - name: Apply schema (DEV)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f db/migrations/001_create_customers.sql

      - name: Run ETL (DEV)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f etl/load_customers.sql

      - name: DEV Validation / Unit Test
        run: |
          echo "Running DEV validation..."
          COUNT=$(PGPASSWORD=$DB_PASSWORD psql -t -A -h $DB_HOST -U $DB_USER -d $DB_NAME -c "SELECT COUNT(*) FROM customers WHERE email IS NULL;")
          if [ "$COUNT" != "0" ]; then
            echo "❌ Validation failed: some customers have NULL emails"
            exit 1
          else
            echo "✅ DEV validation passed"

  # -------------------------
  # 2️⃣ DEPLOY INT + Validation + Schema Check
  # -------------------------
  deploy-int:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: int
    steps:
      - uses: actions/checkout@v4

      - name: Set ENV variables
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME_INT }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST_INT }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER_INT }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD_INT }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT_INT }}" >> $GITHUB_ENV

      - name: Schema Validation (INT)
        run: |
          echo "Validating INT schema..."
          EXPECTED_COLUMNS=("id" "name" "email" "created_at")
          for col in "${EXPECTED_COLUMNS[@]}"; do
            EXISTS=$(PGPASSWORD=$DB_PASSWORD psql -t -A -h $DB_HOST -U $DB_USER -d $DB_NAME -c "SELECT column_name FROM information_schema.columns WHERE table_name='customers' AND column_name='$col';")
            if [ -z "$EXISTS" ]; then
              echo "❌ Schema validation failed: missing column $col"
              exit 1
            fi
          done
          echo "✅ INT schema validation passed"

      - name: Apply schema (INT)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f db/migrations/001_create_customers.sql

      - name: Run ETL (INT)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f etl/load_customers.sql

      - name: INT Validation / Unit Test
        run: |
          echo "Running INT validation..."
          COUNT=$(PGPASSWORD=$DB_PASSWORD psql -t -A -h $DB_HOST -U $DB_USER -d $DB_NAME -c "SELECT COUNT(*) FROM customers WHERE email IS NULL;")
          if [ "$COUNT" != "0" ]; then
            echo "❌ Validation failed: some customers have NULL emails"
            exit 1
          else
            echo "✅ INT validation passed"

  # -------------------------
  # 3️⃣ DEPLOY QA + Schema Check
  # -------------------------
  deploy-qa:
    runs-on: ubuntu-latest
    needs: deploy-int
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Set ENV variables
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME_QA }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST_QA }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER_QA }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD_QA }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT_QA }}" >> $GITHUB_ENV

      - name: Schema Validation (QA)
        run: |
          echo "Validating QA schema..."
          EXPECTED_COLUMNS=("id" "name" "email" "created_at")
          for col in "${EXPECTED_COLUMNS[@]}"; do
            EXISTS=$(PGPASSWORD=$DB_PASSWORD psql -t -A -h $DB_HOST -U $DB_USER -d $DB_NAME -c "SELECT column_name FROM information_schema.columns WHERE table_name='customers' AND column_name='$col';")
            if [ -z "$EXISTS" ]; then
              echo "❌ Schema validation failed: missing column $col"
              exit 1
            fi
          done
          echo "✅ QA schema validation passed"

      - name: Apply schema (QA)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f db/migrations/001_create_customers.sql

      - name: Run ETL (QA)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f etl/load_customers.sql

  # -------------------------
  # 4️⃣ DEPLOY PROD + Rollback + Schema Check + Monitoring
  # -------------------------
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set ENV variables
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME_PROD }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST_PROD }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER_PROD }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT_PROD }}" >> $GITHUB_ENV

      - name: Schema Validation (PROD)
        run: |
          echo "Validating PROD schema..."
          EXPECTED_COLUMNS=("id" "name" "email" "created_at")
          for col in "${EXPECTED_COLUMNS[@]}"; do
            EXISTS=$(PGPASSWORD=$DB_PASSWORD psql -t -A -h $DB_HOST -U $DB_USER -d $DB_NAME -c "SELECT column_name FROM information_schema.columns WHERE table_name='customers' AND column_name='$col';")
            if [ -z "$EXISTS" ]; then
              echo "❌ Schema validation failed: missing column $col"
              exit 1
            fi
          done
          echo "✅ PROD schema validation passed"

      - name: Backup PROD customers table
        run: |
          echo "Backing up PROD customers table..."
          PGPASSWORD=$DB_PASSWORD pg_dump -t customers "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" > backup_customers.sql

      - name: Apply schema (PROD)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" -f db/migrations/001_create_customers.sql

      - name: Run ETL (PROD)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" -f etl/load_customers.sql

      - name: Rollback if PROD failed
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Restoring backup..."
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" -f backup_customers.sql

      - name: Monitor consistency across all environments (hash)
        run: |
          echo "Checking data consistency across all environments..."
          hash_table() {
            local HOST=$1
            local USER=$2
            local PASSWORD=$3
            local DB=$4
            PGPASSWORD=$PASSWORD psql -t -A -h $HOST -U $USER -d $DB -c "SELECT md5(string_agg(t::text, '')) FROM (SELECT * FROM customers ORDER BY id) t;"
          }
          DEV_HASH=$(hash_table "${{ secrets.DB_HOST_DEV }}" "${{ secrets.DB_USER_DEV }}" "${{ secrets.DB_PASSWORD_DEV }}" "${{ secrets.DB_NAME_DEV }}")
          INT_HASH=$(hash_table "${{ secrets.DB_HOST_INT }}" "${{ secrets.DB_USER_INT }}" "${{ secrets.DB_PASSWORD_INT }}" "${{ secrets.DB_NAME_INT }}")
          QA_HASH=$(hash_table "${{ secrets.DB_HOST_QA }}" "${{ secrets.DB_USER_QA }}" "${{ secrets.DB_PASSWORD_QA }}" "${{ secrets.DB_NAME_QA }}")
          PROD_HASH=$(hash_table "${{ secrets.DB_HOST_PROD }}" "${{ secrets.DB_USER_PROD }}" "${{ secrets.DB_PASSWORD_PROD }}" "${{ secrets.DB_NAME_PROD }}")
          echo "DEV: $DEV_HASH, INT: $INT_HASH, QA: $QA_HASH, PROD: $PROD_HASH"
          if [ "$DEV_HASH" != "$INT_HASH" ] || [ "$DEV_HASH" != "$QA_HASH" ] || [ "$DEV_HASH" != "$PROD_HASH" ]; then
            echo "⚠️ Data mismatch detected across environments!"
            exit 1
          else
            echo "✅ All environments have consistent data."
