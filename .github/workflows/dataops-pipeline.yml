name: DataOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  # -------------------------
  # 1️⃣ DEPLOY DEV
  # -------------------------
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set ENV variables
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV

      - name: Apply schema (DEV)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f db/migrations/001_create_customers.sql

      - name: Run ETL (DEV)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f etl/load_customers.sql

  # -------------------------
  # 2️⃣ DEPLOY INT
  # -------------------------
  deploy-int:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: int
    steps:
      - uses: actions/checkout@v4

      - name: Set ENV variables
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV

      - name: Apply schema (INT)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f db/migrations/001_create_customers.sql

      - name: Run ETL (INT)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f etl/load_customers.sql

  # -------------------------
  # 3️⃣ DEPLOY QA
  # -------------------------
  deploy-qa:
    runs-on: ubuntu-latest
    needs: deploy-int
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Set ENV variables
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV

      - name: Apply schema (QA)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f db/migrations/001_create_customers.sql

      - name: Run ETL (QA)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f etl/load_customers.sql

  # -------------------------
  # 4️⃣ DEPLOY PROD (Manual Approval + Rollback + Monitoring)
  # -------------------------
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set ENV variables
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV

      - name: Backup PROD customers table
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -c "COPY customers TO STDOUT" > backup_customers.csv

      - name: Apply schema (PROD)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f db/migrations/001_create_customers.sql

      - name: Run ETL (PROD)
        run: |
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
          -f etl/load_customers.sql

      - name: Rollback if PROD failed
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Restoring backup..."
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" -c "TRUNCATE customers;"
          PGPASSWORD=$DB_PASSWORD psql "postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" -c "\copy customers FROM 'backup_customers.csv' WITH CSV"

      - name: Monitor consistency across all environments
        run: |
          echo "Checking data consistency..."
          hash_table() {
            local HOST=$1
            local USER=$2
            local PASSWORD=$3
            local DB=$4
            PGPASSWORD=$PASSWORD psql "postgresql://${USER}@${HOST}:${DB_PORT}/${DB}?sslmode=require" -t -A \
            -c "SELECT md5(string_agg(t::text, '')) FROM (SELECT * FROM customers ORDER BY id) t;"
          }
          DEV_HASH=$(hash_table "${{ secrets.DB_HOST }}" "${{ secrets.DB_USER }}" "${{ secrets.DB_PASSWORD }}" "${{ secrets.DB_NAME }}")
          INT_HASH=$(hash_table "${{ secrets.DB_HOST }}" "${{ secrets.DB_USER }}" "${{ secrets.DB_PASSWORD }}" "${{ secrets.DB_NAME }}")
          QA_HASH=$(hash_table "${{ secrets.DB_HOST }}" "${{ secrets.DB_USER }}" "${{ secrets.DB_PASSWORD }}" "${{ secrets.DB_NAME }}")
          PROD_HASH=$(hash_table "${{ secrets.DB_HOST }}" "${{ secrets.DB_USER }}" "${{ secrets.DB_PASSWORD }}" "${{ secrets.DB_NAME }}")
          echo "DEV: $DEV_HASH, INT: $INT_HASH, QA: $QA_HASH, PROD: $PROD_HASH"
          if [ "$DEV_HASH" != "$INT_HASH" ] || [ "$DEV_HASH" != "$QA_HASH" ] || [ "$DEV_HASH" != "$PROD_HASH" ]; then
            echo "⚠️ Data mismatch detected across environments!"
            exit 1
          else
            echo "✅ All environments have consistent data."
